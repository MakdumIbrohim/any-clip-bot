name: snap-save-kit-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: snap-save-kit-bot:latest
    container_name: snap-save-kit-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/snapkit.db
      - TMP_DIR=/app/data/tmp
